name: macOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja eigen glm

      - name: Configure
        run: cmake --preset ninja-multi

      - name: Build
        run: cmake --build --preset ninja-multi-release

      - name: Run every example
        run: |
          status=0
          for exe in build/bin/Release/*; do
            [ -x "$exe" ] || continue
            echo "::group::$(basename "$exe")"
            "$exe" < /dev/null || { echo "::error::$(basename "$exe") failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
