name: Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      # cl.exe on PATH for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        run: cmake --preset vcpkg

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run every example
        shell: bash
        run: |
          status=0
          for exe in build/bin/${{ matrix.build_type }}/*.exe; do
            echo "::group::$(basename "$exe")"
            "$exe" < /dev/null || { echo "::error::$(basename "$exe") failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
