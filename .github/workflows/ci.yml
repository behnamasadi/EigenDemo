name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        # vcpkg: versions pinned by vcpkg.json (Eigen 5).
        # apt: Ubuntu's own packages (Eigen 3.4), what `apt install` users get.
        deps: [vcpkg, apt]
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      PRESET: ${{ matrix.deps == 'vcpkg' && 'vcpkg' || 'ninja-multi' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install dependencies (apt)
        if: matrix.deps == 'apt'
        run: sudo apt-get install -y --no-install-recommends libeigen3-dev libglm-dev liborocos-kdl-dev

      - name: Set up vcpkg
        if: matrix.deps == 'vcpkg'
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        run: cmake --preset "$PRESET"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run every example
        run: |
          # Ninja Multi-Config places binaries under build/bin/<Config>/.
          status=0
          for exe in build/bin/${{ matrix.build_type }}/*; do
            [ -x "$exe" ] || continue
            echo "::group::$(basename "$exe")"
            timeout 120 "$exe" < /dev/null || { echo "::error::$(basename "$exe") failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  format:
    name: clang-format (advisory)
    runs-on: ubuntu-latest
    # Advisory only: reports style drift without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install clang-format
        # Pin the version so local and CI formatting agree exactly.
        run: pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          files=$(find src -name '*.cpp' -o -name '*.hpp')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi
