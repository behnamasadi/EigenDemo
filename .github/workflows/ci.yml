name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }} / Eigen ${{ matrix.eigen }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        # 3.4 from apt (Ubuntu's package); 5 built from the upstream release.
        eigen: ['3.4', '5.0.1']

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libeigen3-dev libglm-dev liborocos-kdl-dev

      - name: Install Eigen ${{ matrix.eigen }} from source
        if: matrix.eigen != '3.4'
        run: |
          curl -fsSL "https://gitlab.com/libeigen/eigen/-/archive/${{ matrix.eigen }}/eigen-${{ matrix.eigen }}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/eigen-${{ matrix.eigen }}" -B "$RUNNER_TEMP/eigen-build" -G Ninja \
            -DEIGEN_BUILD_DOC=OFF -DEIGEN_BUILD_TESTING=OFF -DBUILD_TESTING=OFF
          cmake --install "$RUNNER_TEMP/eigen-build" --prefix "$RUNNER_TEMP/eigen"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/eigen" >> "$GITHUB_ENV"

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"      >> "$GITHUB_ENV"
            echo "CXX=g++"     >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset ninja-multi

      - name: Build
        run: cmake --build --preset ninja-multi-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

      - name: Run every example
        run: |
          # Ninja Multi-Config places binaries under build/bin/<Config>/.
          status=0
          for exe in build/bin/${{ matrix.build_type }}/*; do
            [ -x "$exe" ] || continue
            echo "::group::$(basename "$exe")"
            timeout 120 "$exe" < /dev/null || { echo "::error::$(basename "$exe") failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  format:
    name: clang-format (advisory)
    runs-on: ubuntu-latest
    # Advisory only: reports style drift without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install clang-format
        # Pin the version so local and CI formatting agree exactly.
        run: pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          files=$(find src -name '*.cpp' -o -name '*.hpp')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi
